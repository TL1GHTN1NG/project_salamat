    <style>
        :root {
            --bg-color: #0f172a;
            --page-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Padding diperbesar untuk memberi ruang "napas" yang lebih luas */
            padding: 100px 60px;
        }

        #flipbook {
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            visibility: hidden;
        }

        .page {
            background-color: var(--page-bg);
            overflow: hidden;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .page img {
            width: 100%;
            height: 100%;
            /* Pastikan gambar tidak ter-crop */
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Navigasi Overlay */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            color: white;
            padding: 1.2rem 0.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: rgba(59, 130, 246, 0.4);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-50%) scale(1.1);
        }

        .btn-prev { left: 20px; border-radius: 8px; }
        .btn-next { right: 20px; border-radius: 8px; }

        /* Footer UI */
        .ui-footer {
            position: fixed;
            bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 99px;
            color: #f8fafc;
            font-size: 0.7rem;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* Bayangan Lipatan Tengah */
        .page.--left {
            box-shadow: inset -20px 0 30px -15px rgba(0,0,0,0.15);
        }
        .page.--right {
            box-shadow: inset 20px 0 30px -15px rgba(0,0,0,0.15);
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const flipbookElement = document.getElementById('flipbook');
            
            // Rasio A4 asli
            const baseWidth = 595;
            const baseHeight = 842;

            const pageFlip = new St.PageFlip(flipbookElement, {
                width: baseWidth, 
                height: baseHeight,
                size: "stretch",
                minWidth: 100,
                // Diperketat lagi agar tidak pernah terlalu besar
                maxWidth: 450, 
                minHeight: 150,
                maxHeight: 650,
                drawShadow: true,
                flippingTime: 800,
                usePortrait: true,
                startPage: 0,
                showCover: true,
                mobileScrollSupport: false,
                swipeDistance: 30
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            // Navigation
            document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
            document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());

            // UI Updates
            pageFlip.on('flip', (e) => {
                document.getElementById('page-label').innerText = `Hal. ${e.data + 1} / ${pageFlip.getPageCount()}`;
            });

            function autoFit() {
                // scaleFactor diturunkan ke 0.55 untuk memberikan jarak pandang yang sangat lega (zoom out)
                // Ini memastikan konten teks di bagian bawah tidak terhalang UI
                const scaleFactor = 0.55; 
                
                pageFlip.update(); 
                flipbookElement.style.visibility = 'visible';
            }

            window.addEventListener('resize', autoFit);
            setTimeout(autoFit, 300);

            document.addEventListener('keydown', (e) => {
                if(e.key === "ArrowLeft") pageFlip.flipPrev();
                if(e.key === "ArrowRight") pageFlip.flipNext();
            });
        });
    </script>
